<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SKU Generator</title>
  <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
  <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Header w/ navigation -->
  <header>
    <h1>Skewer</h1>
    <nav>
      <a href="receipt.html">Receipt Generator</a> | <a href="index.html">Home</a>
    </nav>
  </header>

  <!-- SKU generator form -->
  <div class="container gradient">
    <h2>SKU Generator</h2>
    <form>
      <!-- Dropdown -->
      <label>Category</label>
      <select id="categories" class="input">
        <option value="perish">Perishables</option>
        <option value="semi">Semi-Perishables</option>
        <option value="non">Non-Perishables</option>
      </select><br><br>

      <!-- Product name input -->
      <label>Product Name</label>
      <input type="text" id="prod" placeholder="e.g. Bottled Water" class="input"><br><br>

      <!-- Stock quantity input -->
      <label>Stock Quantity</label>
      <input type="number" id="stock" placeholder="e.g. 50" class="input"><br><br>

      <!-- Button Python function -->
      <input type="button" py-click="sku_generation" value="Generate SKU Key" class="button">
    </form>
    <!-- Output -->
    <div id="output" class="output">Your generated SKU will appear here.</div>
  </div>

  <footer>
    <p>SKU Generator - 1st Quarter Project</p>
  </footer>

  <py-script src="main.py"></py-script>
</body>
</html>
